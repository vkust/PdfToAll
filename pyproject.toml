[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pdftoall"
version = "0.1.0"
description = "Convert PDF into DOCX, XLSX and PPTX locally and privately."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "PdfToAll contributors" }]
keywords = ["pdf", "docx", "pptx", "xlsx", "converter", "offline", "privacy"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Office/Business :: Office Suites",
]
dependencies = [
  "pdfplumber>=0.11",
  "python-docx>=1.1",
  "python-pptx>=1.0",
  "openpyxl>=3.1",
]

[project.optional-dependencies]
docling = ["docling>=2.0"]
marker = ["marker-pdf>=2.0"]
ocr = ["pypdfium2>=4", "surya-ocr>=0.6"]
api = ["fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9"]
dev = ["pytest>=8", "reportlab>=4", "ruff>=0.6"]

[project.scripts]
pdftoall = "pdftoall.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
  "B008",  # FastAPI declares File()/Form() in defaults by design
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["SIM115"]  # short-lived fixture reads
