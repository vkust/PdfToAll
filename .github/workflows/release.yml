name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish (e.g. v0.1.0)
        required: true

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends binutils
          python -m pip install --upgrade pip
          python -m pip install pyinstaller
          python -m pip install -e .

      - name: Install nfpm
        run: |
          curl -sSL -o nfpm.tgz https://github.com/goreleaser/nfpm/releases/download/v2.41.1/nfpm_2.41.1_Linux_x86_64.tar.gz
          sudo tar -xzf nfpm.tgz -C /usr/local/bin nfpm
          nfpm --version

      - name: Tag must match package version
        run: |
          V=$(python -c "import pdftoall; print(pdftoall.__version__)")
          T="${GITHUB_REF_NAME#v}"
          echo "package=$V tag=$T"
          test "$V" = "$T" || { echo "::error::tag $T does not match pdfToAll.__version__ $V"; exit 1; }

      - name: Build binary + deb + rpm + tarball
        run: bash packaging/build-linux.sh "${GITHUB_REF_NAME#v}"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            dist/packages/*.deb
            dist/packages/*.rpm
            dist/packages/*.tar.gz
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64
          cache: pip

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller
          python -m pip install -e .

      - name: Build portable zip
        run: pwsh -File packaging/build-windows.ps1 -Version "$env:GITHUB_REF_NAME".TrimStart("v")

      - uses: actions/upload-artifact@v4
        with:
          name: windows-package
          path: dist/packages/*.zip
          if-no-files-found: error

  publish:
    needs: [linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Checksums
        run: |
          cd release-assets
          ls -l
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
          fail_on_unmatched_files: true
